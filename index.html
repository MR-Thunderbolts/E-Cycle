<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />

  <!-- Primary Meta Tags -->
  <title>E-Cycle - Recicla Electrónicos, Gana Recompensas</title>
  <meta name="title" content="E-Cycle - Recicla Electrónicos, Gana Recompensas" />
  <meta name="description"
    content="Encuentra puntos de reciclaje cercanos, deposita tus dispositivos electrónicos antiguos y gana recompensas. Contribuye al medio ambiente mientras acumulas beneficios." />
  <meta name="keywords"
    content="reciclaje electrónico, e-waste, reciclaje, puntos de reciclaje, recompensas ecológicas, medio ambiente, sustentabilidad" />

  <!-- PWA Theme Colors -->
  <meta name="theme-color" content="#F5F8F8" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://e-cycle-tau.vercel.app/" />
  <meta property="og:title" content="E-Cycle - Recicla Electrónicos, Gana Recompensas" />
  <meta property="og:description"
    content="Encuentra puntos de reciclaje cercanos, deposita tus dispositivos electrónicos antiguos y gana recompensas." />
  <meta property="og:image" content="https://e-cycle-tau.vercel.app/og-image.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://e-cycle-tau.vercel.app/" />
  <meta property="twitter:title" content="E-Cycle - Recicla Electrónicos, Gana Recompensas" />
  <meta property="twitter:description"
    content="Encuentra puntos de reciclaje cercanos, deposita tus dispositivos electrónicos antiguos y gana recompensas." />
  <meta property="twitter:image" content="https://e-cycle-tau.vercel.app/og-image.png" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    rel="stylesheet" />
  <style>
    /* Critical styles before the bundle loads. Everything else lives in src/styles. */
    html,
    body,
    #root {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* The app handles scrolling internally */
      background-color: #121212;
      overscroll-behavior: none;
    }

    html:not(.dark) body,
    html:not(.dark) #root {
      background-color: #F5F8F8;
    }

    /* Material Symbols FOUT fix: icons stay invisible until the icon font has loaded,
       so raw ligature names (e.g. 'recycling') never flash on screen. */
    .material-symbols-rounded {
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    html.fonts-loaded .material-symbols-rounded {
      opacity: 1;
    }
  </style>
  <script>
    // Apply the saved theme before first paint (dark by default).
    try {
      if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');
    } catch (e) {
      document.documentElement.classList.add('dark');
    }
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <!-- FOUT fix: add .fonts-loaded to <html> once Material Symbols font resolves -->
  <script>
    document.fonts.ready.then(function () {
      document.documentElement.classList.add('fonts-loaded');
    });
  </script>
</body>

</html>
